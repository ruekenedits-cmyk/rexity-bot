# fly.toml app configuration file generated for rexity-bot on 2026-11-09T08:59:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rexity-bot'
primary_region = 'ams'

[build]
[env]
  DB_FILE = '/data/redeemed.json'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
